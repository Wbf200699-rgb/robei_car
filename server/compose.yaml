services:
  uwb-server:
    build:
      context: .
    container_name: little-car-uwb-server
    env_file:
      - .env
    ports:
      - "18765:8765"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
